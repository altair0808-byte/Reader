<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Чтение книги — AI Книги</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/auth-client.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800" x-data="readerApp()" x-init="init()">
    <div class="max-w-3xl mx-auto p-6">
        <!-- Верхняя панель -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-200">
            <a href="/" class="text-sm text-blue-600 hover:underline font-medium">← На главную</a>
            <h1 class="font-bold text-slate-700 truncate max-w-md" x-text="book.title"></h1>
            <div></div>
        </div>

        <!-- Ошибка / Загрузка -->
        <div x-show="error" x-text="error" class="p-4 bg-red-100 text-red-700 rounded-lg mb-4 text-sm"></div>
        <div x-show="loading" class="text-center py-12 text-slate-400">Загрузка книги...</div>

        <!-- Контент читалки -->
        <div x-show="!loading && chapter">
            <!-- Управление главой (Редактировать / Добавить) — видно только автору или админу -->
            <div class="flex items-center gap-2 mb-4" x-show="isOwnerOrAdmin">
                <button @click="openEditModal()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs rounded-lg font-medium transition flex items-center gap-1">
                    ✏️ Редактировать главу
                </button>
                <button @click="openAddModal()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs rounded-lg font-medium transition flex items-center gap-1">
                    ➕ Добавить главу
                </button>
            </div>

            <!-- Шапка главы -->
            <div class="mb-6">
                <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider" x-text="`Глава ${chapter.chapter_number}`"></span>
                <h2 class="text-2xl font-bold text-slate-900 mt-1" x-text="chapter.title"></h2>
            </div>

            <!-- Текст главы -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 prose max-w-none whitespace-pre-line font-serif text-lg leading-relaxed text-slate-700" x-text="chapter.content"></div>

            <!-- Навигация по главам -->
            <div class="flex justify-between items-center mt-8">
                <button @click="changeChapter(currentChapterNum - 1)" :disabled="currentChapterNum <= 1" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm font-medium hover:bg-slate-50 disabled:opacity-30">
                    ← Предыдущая глава
                </button>
                <span class="text-sm text-slate-500 font-medium" x-text="`Глава ${currentChapterNum} из ${chapters.length}`"></span>
                <button @click="changeChapter(currentChapterNum + 1)" :disabled="currentChapterNum >= chapters.length" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm font-medium hover:bg-slate-50 disabled:opacity-30">
                    Следующая глава →
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для Редактирования / Добавления главы -->
    <div x-show="modalOpen" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 space-y-4 shadow-xl" @click.away="modalOpen = false">
            <h3 class="text-lg font-bold text-slate-800" x-text="modalMode === 'edit' ? 'Редактировать главу' : 'Новая глава'"></h3>
            
            <div>
                <label class="text-xs text-slate-500 font-medium">Название главы</label>
                <input type="text" x-model="currentChapterTitle" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="text-xs text-slate-500 font-medium">Текст главы</label>
                <textarea x-model="currentChapterContent" rows="10" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm font-serif focus:outline-none focus:border-blue-500"></textarea>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button @click="modalOpen = false" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm rounded-lg font-medium">Отмена</button>
                <button @click="saveChapter()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg font-medium">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
    function readerApp() {
        return {
            bookId: null,
            currentChapterNum: 1,
            book: {},
            chapters: [],
            chapter: null,
            loading: true,
            error: null,
            currentUser: null,
            isOwnerOrAdmin: false,

            // Управление модалкой
            modalOpen: false,
            modalMode: 'edit',
            currentChapterTitle: '',
            currentChapterContent: '',
            editingChapterId: null,

            async init() {
                const urlParams = new URLSearchParams(window.location.search);
                this.bookId = urlParams.get('id');
                const chNum = urlParams.get('chapter');
                if (chNum) this.currentChapterNum = parseInt(chNum);

                if (!this.bookId) {
                    this.error = 'Книга не указана';
                    this.loading = false;
                    return;
                }

                try {
                    const token = getToken();
                    
                    // Получаем текущего пользователя для проверки прав
                    const userRes = await fetch('/api/auth/me', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (userRes.ok) {
                        const userData = await userRes.json();
                        this.currentUser = userData.user;
                    }

                    // Загружаем инфо о книге
                    const bookRes = await fetch(`/api/books/${this.bookId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!bookRes.ok) throw new Error('Не удалось загрузить книгу');
                    const bookData = await bookRes.json();
                    this.book = bookData.book;

                    // Проверяем права (владелец книги или админ)
                    if (this.currentUser) {
                        const isAdmin = this.currentUser.role === 'admin' || this.currentUser.role === 'superadmin';
                        const isOwner = this.book.user_id === this.currentUser.id;
                        this.isOwnerOrAdmin = isAdmin || isOwner;
                    }

                    // Загружаем список глав
                    const chaptersRes = await fetch(`/api/books/${this.bookId}/chapters`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!chaptersRes.ok) throw new Error('Не удалось загрузить главы');
                    const chaptersData = await chaptersRes.json();
                    this.chapters = chaptersData.chapters;

                    if (this.chapters.length > 0) {
                        const targetExists = this.chapters.some(c => c.chapter_number === this.currentChapterNum);
                        if (!targetExists) {
                            this.currentChapterNum = this.chapters[0].chapter_number;
                        }
                        await this.loadChapterContent(this.currentChapterNum);
                    } else {
                        this.error = 'В этой книге пока нет глав';
                    }
                } catch (e) {
                    this.error = e.message;
                } finally {
                    this.loading = false;
                }
            },

            async loadChapterContent(num) {
                try {
                    const token = getToken();
                    const res = await fetch(`/api/books/${this.bookId}/chapters/${num}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!res.ok) throw new Error('Ошибка загрузки главы');
                    const data = await res.json();
                    this.chapter = data.chapter;
                    this.currentChapterNum = num;

                    const newUrl = `?id=${this.bookId}&chapter=${num}`;
                    window.history.pushState({path: newUrl}, '', newUrl);
                } catch (e) {
                    this.error = e.message;
                }
            },

            changeChapter(num) {
                if (num >= 1 && num <= this.chapters.length) {
                    this.loadChapterContent(num);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            },

            openEditModal() {
                if (!this.chapter) return;
                this.modalMode = 'edit';
                this.currentChapterTitle = this.chapter.title;
                this.currentChapterContent = this.chapter.content;
                this.editingChapterId = this.chapter.id;
                this.modalOpen = true;
            },

            openAddModal() {
                this.modalMode = 'add';
                this.currentChapterTitle = `Глава ${(this.chapters.length || 0) + 1}`;
                this.currentChapterContent = '';
                this.editingChapterId = null;
                this.modalOpen = true;
            },

            async saveChapter() {
                const token = getToken();
                try {
                    let url, method;
                    if (this.modalMode === 'edit') {
                        url = `/api/books/${this.bookId}/chapters/${this.editingChapterId}`;
                        method = 'PUT';
                    } else {
                        url = `/api/books/${this.bookId}/chapters`;
                        method = 'POST';
                    }

                    const res = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            title: this.currentChapterTitle,
                            content: this.currentChapterContent
                        })
                    });

                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);

                    this.modalOpen = false;
                    location.reload(); // Обновляем страницу для подгрузки актуальных данных
                } catch (e) {
                    alert('Ошибка: ' + e.message);
                }
            }
        }
    }
    </script>
</body>
</html>
