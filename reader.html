<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Чтение книги — AI Книги</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/auth-client.js"></script>
    <style>
        .theme-light  { background: #f8fafc; color: #1e293b; }
        .theme-dark   { background: #111827; color: #e5e7eb; }
        .theme-gray   { background: #4b5563; color: #f8fafc; }
        .theme-sepia  { background: #f4ecd8; color: #5b4636; }
        .theme-ocean  { background: #0f2942; color: #cde6f5; }
    </style>
</head>
<body class="min-h-screen" x-data="readerApp()" x-init="init()" :class="'theme-' + settings.theme">
    <div class="max-w-3xl mx-auto p-6">
        <!-- Верхняя панель -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b" :class="isDarkTheme ? 'border-white/10' : 'border-slate-200'">
            <a :href="`/book.html?book_id=${bookId}`" class="text-sm text-blue-600 hover:underline font-medium">← К книге</a>
            <h1 class="font-bold truncate max-w-md" x-text="book.title"></h1>
            <div></div>
        </div>

        <!-- Ошибка / Загрузка -->
        <div x-show="error" x-text="error" class="p-4 bg-red-100 text-red-700 rounded-lg mb-4 text-sm"></div>
        <div x-show="loading" class="text-center py-12 opacity-50">Загрузка книги...</div>

        <!-- Контент читалки -->
        <div x-show="!loading && chapter">
            <!-- Управление главой (Редактировать / Добавить) — видно только автору или админу -->
            <div class="flex items-center gap-2 mb-4" x-show="isOwnerOrAdmin">
                <button @click="openEditModal()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs rounded-lg font-medium transition flex items-center gap-1">
                    ✏️ Редактировать главу
                </button>
                <button @click="openAddModal()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs rounded-lg font-medium transition flex items-center gap-1">
                    ➕ Добавить главу
                </button>
            </div>

            <!-- Шапка главы -->
            <div class="mb-6">
                <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider" x-text="`Глава ${chapter.chapter_number}`"></span>
                <h2 class="text-2xl font-bold mt-1" x-text="chapter.title"></h2>
            </div>

            <!-- Текст главы -->
            <div class="p-8 rounded-2xl shadow-sm border prose max-w-none whitespace-pre-line font-serif text-lg leading-relaxed"
                 :class="isDarkTheme ? 'bg-black/20 border-white/10' : 'bg-white border-slate-200'"
                 x-text="chapter.content"></div>

            <!-- Навигация по главам -->
            <div class="flex justify-between items-center mt-8">
                <button @click="changeChapter(currentChapterNum - 1)" :disabled="currentChapterNum <= 1"
                        class="px-4 py-2 border rounded-lg text-sm font-medium disabled:opacity-30"
                        :class="isDarkTheme ? 'bg-black/20 border-white/10 hover:bg-black/30' : 'bg-white border-slate-300 hover:bg-slate-50'">
                    ← Предыдущая глава
                </button>
                <span class="text-sm opacity-60 font-medium" x-text="`Глава ${currentChapterNum} из ${chapters.length}`"></span>
                <button @click="changeChapter(currentChapterNum + 1)" :disabled="currentChapterNum >= chapters.length"
                        class="px-4 py-2 border rounded-lg text-sm font-medium disabled:opacity-30"
                        :class="isDarkTheme ? 'bg-black/20 border-white/10 hover:bg-black/30' : 'bg-white border-slate-300 hover:bg-slate-50'">
                    Следующая глава →
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для Редактирования / Добавления главы -->
    <div x-show="modalOpen" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 space-y-4 shadow-xl text-slate-800" @click.away="modalOpen = false">
            <h3 class="text-lg font-bold text-slate-800" x-text="modalMode === 'edit' ? 'Редактировать главу' : 'Новая глава'"></h3>

            <div>
                <label class="text-xs text-slate-500 font-medium">Название главы</label>
                <input type="text" x-model="currentChapterTitle" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="text-xs text-slate-500 font-medium">Текст главы</label>
                <textarea x-model="currentChapterContent" rows="10" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm font-serif focus:outline-none focus:border-blue-500"></textarea>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button @click="modalOpen = false" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm rounded-lg font-medium">Отмена</button>
                <button @click="saveChapter()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg font-medium">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
    function readerApp() {
        return {
            bookId: null,
            currentChapterNum: 1,
            book: {},
            chapters: [],
            chapter: null,
            loading: true,
            error: null,
            currentUser: null,
            isOwnerOrAdmin: false,
            settings: { theme: 'light' },

            // Управление модалкой
            modalOpen: false,
            modalMode: 'edit',
            currentChapterTitle: '',
            currentChapterContent: '',
            editingChapterId: null,

            get isDarkTheme() {
                return ['dark', 'gray', 'ocean'].includes(this.settings.theme);
            },

            async init() {
                if (!requireAuthOrRedirect()) return;

                const urlParams = new URLSearchParams(window.location.search);
                this.bookId = urlParams.get('book_id');
                const chNum = urlParams.get('chapter');
                if (chNum) this.currentChapterNum = parseInt(chNum);

                if (!this.bookId) {
                    this.error = 'Книга не указана';
                    this.loading = false;
                    return;
                }

                try {
                    // Получаем текущего пользователя (для прав и сохранённой темы)
                    const meRes = await authFetch('/api/users/me');
                    if (meRes.ok) {
                        const me = (await meRes.json()).user;
                        this.currentUser = me;
                        if (me.reader_settings?.theme) this.settings.theme = me.reader_settings.theme;
                    }

                    // Загружаем инфо о книге
                    const bookRes = await authFetch(`/api/books/${this.bookId}`);
                    if (!bookRes.ok) throw new Error('Не удалось загрузить книгу');
                    const bookData = await bookRes.json();
                    this.book = bookData.book;

                    // Проверяем права (владелец книги или админ)
                    if (this.currentUser) {
                        const isAdmin = this.currentUser.role === 'admin' || this.currentUser.role === 'superadmin';
                        const isOwner = this.book.user_id === this.currentUser.id;
                        this.isOwnerOrAdmin = isAdmin || isOwner;
                    }

                    // Загружаем список глав
                    const chaptersRes = await authFetch(`/api/books/${this.bookId}/chapters`);
                    if (!chaptersRes.ok) throw new Error('Не удалось загрузить главы');
                    const chaptersData = await chaptersRes.json();
                    this.chapters = chaptersData.chapters;

                    if (this.chapters.length > 0) {
                        const targetExists = this.chapters.some(c => c.chapter_number === this.currentChapterNum);
                        if (!targetExists) {
                            this.currentChapterNum = this.chapters[0].chapter_number;
                        }
                        await this.loadChapterContent(this.currentChapterNum);
                    } else {
                        this.error = 'В этой книге пока нет глав';
                    }
                } catch (e) {
                    this.error = e.message;
                } finally {
                    this.loading = false;
                }
            },

            async loadChapterContent(num) {
                try {
                    const res = await authFetch(`/api/books/${this.bookId}/chapters/${num}`);
                    if (!res.ok) throw new Error('Ошибка загрузки главы');
                    const data = await res.json();
                    this.chapter = data.chapter;
                    this.currentChapterNum = num;

                    const newUrl = `?book_id=${this.bookId}&chapter=${num}`;
                    window.history.pushState({ path: newUrl }, '', newUrl);
                } catch (e) {
                    this.error = e.message;
                }
            },

            changeChapter(num) {
                if (num >= 1 && num <= this.chapters.length) {
                    this.loadChapterContent(num);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            },

            openEditModal() {
                if (!this.chapter) return;
                this.modalMode = 'edit';
                this.currentChapterTitle = this.chapter.title;
                this.currentChapterContent = this.chapter.content;
                this.editingChapterId = this.chapter.id;
                this.modalOpen = true;
            },

            openAddModal() {
                this.modalMode = 'add';
                this.currentChapterTitle = `Глава ${(this.chapters.length || 0) + 1}`;
                this.currentChapterContent = '';
                this.editingChapterId = null;
                this.modalOpen = true;
            },

            async saveChapter() {
                try {
                    let url, method;
                    if (this.modalMode === 'edit') {
                        url = `/api/books/${this.bookId}/chapters/${this.editingChapterId}`;
                        method = 'PUT';
                    } else {
                        url = `/api/books/${this.bookId}/chapters`;
                        method = 'POST';
                    }

                    const res = await authFetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: this.currentChapterTitle,
                            content: this.currentChapterContent
                        })
                    });

                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);

                    this.modalOpen = false;
                    location.reload(); // Обновляем страницу для подгрузки актуальных данных
                } catch (e) {
                    alert('Ошибка: ' + e.message);
                }
            }
        }
    }
    </script>
</body>
</html>
