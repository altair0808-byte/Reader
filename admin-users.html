<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Управление пользователями — SuperAdmin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="/auth-client.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">

<div x-data="userAdminPanel()" x-init="init()" class="max-w-4xl mx-auto py-10 px-4">

    <div class="flex items-center justify-between mb-4 text-sm">
        <a href="/" class="text-slate-500 hover:underline">← Все книги</a>
        <button @click="logout()" class="text-slate-500 hover:underline">Выйти</button>
    </div>

    <h1 class="text-2xl font-bold text-slate-800 mb-1">Управление пользователями</h1>
    <p class="text-slate-500 mb-6">Назначайте или снимайте роль «Администратор», удаляйте пользователей. Доступно только Суперадмину.</p>

    <div x-show="error" x-text="error" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg"></div>

    <div x-show="loading" class="text-slate-400">Загрузка...</div>

    <div x-show="!loading" class="bg-white rounded-xl shadow-sm border border-slate-200 divide-y">
        <template x-for="u in users" :key="u.id">
            <div class="flex items-center justify-between px-5 py-4">
                <div>
                    <p class="font-medium text-slate-800" x-text="u.display_name || u.email"></p>
                    <p class="text-sm text-slate-500" x-text="u.email"></p>
                </div>

                <div class="flex items-center gap-3">
                    <span
                        class="text-xs px-2 py-1 rounded-full font-medium"
                        :class="{
                            'bg-purple-100 text-purple-700': u.role === 'superadmin',
                            'bg-blue-100 text-blue-700': u.role === 'admin',
                            'bg-slate-100 text-slate-600': u.role === 'reader'
                        }"
                        x-text="roleLabel(u.role)"
                    ></span>

                    <button
                        x-show="u.role === 'reader'"
                        @click="changeRole(u, 'admin')"
                        class="text-sm px-3 py-1.5 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition"
                    >
                        Сделать админом
                    </button>

                    <button
                        x-show="u.role === 'admin'"
                        @click="changeRole(u, 'reader')"
                        class="text-sm px-3 py-1.5 rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300 transition"
                    >
                        Разжаловать
                    </button>

                    <button
                        x-show="u.role !== 'superadmin'"
                        @click="deleteUser(u)"
                        class="text-sm px-3 py-1.5 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition"
                    >
                        Удалить
                    </button>

                    <span
                        x-show="u.role === 'superadmin'"
                        class="text-sm text-slate-400 italic"
                    >недоступно</span>
                </div>
            </div>
        </template>
    </div>
</div>

<script>
function userAdminPanel() {
    return {
        users: [],
        loading: true,
        error: null,

        async init() {
            if (!requireAuthOrRedirect()) return;
            await this.loadUsers();
        },

        async loadUsers() {
            this.loading = true;
            this.error = null;
            try {
                const res = await authFetch('/api/admin/users');
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Ошибка загрузки');
                this.users = data.users;
            } catch (e) {
                this.error = e.message;
            } finally {
                this.loading = false;
            }
        },

        async changeRole(u, newRole) {
            const previousRole = u.role;
            u.role = newRole;
            try {
                const res = await authFetch(`/api/admin/users/${u.id}/role`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: newRole }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Не удалось изменить роль');
            } catch (e) {
                u.role = previousRole;
                this.error = e.message;
            }
        },

        async deleteUser(u) {
            if (!confirm(`Удалить пользователя "${u.display_name || u.email}"? Это действие необратимо.`)) return;

            this.error = null;
            try {
                const res = await authFetch(`/api/admin/users/${u.id}`, { method: 'DELETE' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Не удалось удалить пользователя');
                this.users = this.users.filter((x) => x.id !== u.id);
            } catch (e) {
                this.error = e.message;
            }
        },

        roleLabel(role) {
            return { superadmin: 'Суперадмин', admin: 'Админ', reader: 'Читатель' }[role] || role;
        },
    };
}
</script>

</body>
</html>
