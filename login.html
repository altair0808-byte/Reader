<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход — AI Книги</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="/auth-client.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">

<div x-data="loginForm()" class="w-full max-w-sm bg-white rounded-xl shadow-sm border border-slate-200 p-6">
    <h1 class="text-xl font-bold text-slate-800 mb-1">Вход</h1>
    <p class="text-sm text-slate-500 mb-5">Нет аккаунта? <a href="/register.html" class="text-blue-600 underline">Зарегистрироваться</a></p>

    <div x-show="error" x-text="error" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm"></div>

    <form @submit.prevent="submit()" class="space-y-3">
        <div>
            <label class="text-sm text-slate-600">Email</label>
            <input type="email" x-model="email" required
                   class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>
        <div>
            <label class="text-sm text-slate-600">Пароль</label>
            <input type="password" x-model="password" required
                   class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>
        <button type="submit" :disabled="loading"
                class="w-full py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 transition disabled:opacity-50">
            <span x-text="loading ? 'Входим...' : 'Войти'"></span>
        </button>
    </form>
</div>

<script>
function loginForm() {
    return {
        email: '',
        password: '',
        loading: false,
        error: null,

        async submit() {
            this.loading = true;
            this.error = null;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: this.email, password: this.password }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Не удалось войти');

                setToken(data.token);
                location.href = '/reader.html';
            } catch (e) {
                this.error = e.message;
            } finally {
                this.loading = false;
            }
        },
    };
}
</script>

</body>
</html>
