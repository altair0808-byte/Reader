<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать книгу — AI Книги</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/auth-client.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-6" x-data="bookForm()">

        <div class="flex gap-2 mb-6 border-b border-slate-200">
            <button type="button" @click="tab = 'generate'"
                    class="px-4 py-2 text-sm font-medium border-b-2 transition"
                    :class="tab === 'generate' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500'">
                Сгенерировать с ИИ
            </button>
            <button type="button" @click="tab = 'upload'"
                    class="px-4 py-2 text-sm font-medium border-b-2 transition"
                    :class="tab === 'upload' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500'">
                Загрузить по главам
            </button>
        </div>

        <div x-show="error" x-text="error" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm"></div>
        <div x-show="success" x-text="success" class="mb-4 p-3 bg-green-100 text-green-700 rounded-lg text-sm"></div>

        <!-- ГЕНЕРАЦИЯ С ИИ -->
        <form x-show="tab === 'generate'" @submit.prevent="generate()" class="space-y-4">
            <h1 class="text-xl font-bold text-slate-800 mb-2">Создать новую книгу с ИИ</h1>
            <div>
                <label class="text-sm text-slate-600">Название книги</label>
                <input type="text" x-model="title" required class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>
            <div>
                <label class="text-sm text-slate-600">Жанр</label>
                <input type="text" x-model="genre" placeholder="Фэнтези, детектив, научная фантастика..." class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>
            <div>
                <label class="text-sm text-slate-600">Опишите сюжет или идею для ИИ</label>
                <textarea x-model="prompt" rows="4" required placeholder="О чем должна быть книга, главные герои..." class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
            </div>
            <div>
                <label class="text-sm text-slate-600">Количество глав</label>
                <input type="number" x-model.number="chaptersCount" min="1" max="100" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>
            <button type="submit" :disabled="loading" class="w-full py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 transition disabled:opacity-50">
                <span x-text="loading ? 'Запускаем генерацию...' : 'Сгенерировать книгу'"></span>
            </button>
            <p class="text-xs text-slate-400">Генерация книги идёт в фоне и может занять несколько минут.</p>
        </form>

        <!-- ЗАГРУЗКА КНИГИ ПО ГЛАВАМ -->
        <form x-show="tab === 'upload'" @submit.prevent="uploadWithChapters()" class="space-y-4">
            <h1 class="text-xl font-bold text-slate-800 mb-2">Загрузить книгу по главам</h1>
            <div>
                <label class="text-sm text-slate-600">Название книги</label>
                <input type="text" x-model="uploadTitle" required class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>
            <div>
                <label class="text-sm text-slate-600">Жанр</label>
                <input type="text" x-model="uploadGenre" placeholder="Фэнтези, детектив..." class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>

            <!-- Список глав -->
            <div class="border-t pt-4 mt-4">
                <h3 class="font-medium text-slate-700 mb-2">Главы книги</h3>
                <template x-for="(chapter, index) in uploadChapters" :key="index">
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 mb-3 space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-500" x-text="`Глава ${index + 1}`"></span>
                            <button type="button" @click="uploadChapters.splice(index, 1)" class="text-red-500 text-xs hover:underline" x-show="uploadChapters.length > 1">Удалить</button>
                        </div>
                        <input type="text" x-model="chapter.title" placeholder="Название главы" class="w-full px-3 py-1 border border-slate-300 rounded text-sm" required>
                        <textarea x-model="chapter.content" rows="4" placeholder="Текст главы..." class="w-full px-3 py-1 border border-slate-300 rounded text-sm" required></textarea>
                    </div>
                </template>
                <button type="button" @click="uploadChapters.push({ title: '', content: '' })" class="text-sm text-blue-600 font-medium hover:underline">+ Добавить еще главу</button>
            </div>

            <button type="submit" :disabled="loading" class="w-full py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 transition disabled:opacity-50 mt-4">
                <span x-text="loading ? 'Сохранение...' : 'Опубликовать книгу с главами'"></span>
            </button>
        </form>
    </div>

    <script>
    function bookForm() {
        return {
            tab: 'generate',

            // Генерация с ИИ
            title: '',
            genre: '',
            prompt: '',
            chaptersCount: 5,

            // Загрузка по главам
            uploadTitle: '',
            uploadGenre: '',
            uploadChapters: [{ title: 'Глава 1', content: '' }],

            loading: false,
            error: null,
            success: null,

            async generate() {
                this.loading = true;
                this.error = null;
                this.success = null;

                const token = getToken();

                try {
                    const res = await fetch('/api/books/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            title: this.title,
                            genre: this.genre,
                            prompt: this.prompt,
                            chapters: this.chaptersCount
                        })
                    });

                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Ошибка генерации');

                    this.success = 'Генерация запущена! Книга появится в списке.';
                    setTimeout(() => location.href = '/', 1500);
                } catch (e) {
                    this.error = e.message;
                } finally {
                    this.loading = false;
                }
            },

            async uploadWithChapters() {
                this.loading = true;
                this.error = null;
                this.success = null;

                const token = getToken();

                try {
                    // Создаем книгу и добавляем первую главу
                    const res = await fetch('/api/books/upload', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            title: this.uploadTitle,
                            genre: this.uploadGenre,
                            content: this.uploadChapters[0]?.content || '...'
                        })
                    });

                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Ошибка загрузки');

                    const bookId = data.book.id;

                    // Если глав больше одной, добавляем остальные
                    for (let i = 1; i < this.uploadChapters.length; i++) {
                        await fetch(`/api/books/${bookId}/chapters`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                chapter_number: i + 1,
                                title: this.uploadChapters[i].title,
                                content: this.uploadChapters[i].content
                            })
                        });
                    }

                    this.success = 'Книга и все главы успешно сохранены!';
                    setTimeout(() => location.href = '/', 1500);
                } catch (e) {
                    this.error = e.message;
                } finally {
                    this.loading = false;
                }
            }
        }
    }
    </script>
</body>
</html>
