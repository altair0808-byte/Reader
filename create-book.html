<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Создать книгу</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="/auth-client.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">

<div x-data="createBookForm()" x-init="init()" class="max-w-xl mx-auto py-10 px-4">
    <a href="/" class="text-sm text-slate-500 hover:underline">← Все книги</a>
    <h1 class="text-2xl font-bold text-slate-800 mt-2 mb-6">Создать книгу</h1>

    <div x-show="error" x-text="error" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm"></div>
    <div x-show="success" class="mb-4 p-3 bg-green-100 text-green-700 rounded-lg text-sm">
        Книга создана, генерация запущена. <a :href="`/reader.html?book_id=${createdBookId}&chapter=1`" class="underline">Открыть, когда будет готова</a>
    </div>

    <form @submit.prevent="submit()" class="space-y-4 bg-white p-5 rounded-xl border border-slate-200">
        <div>
            <label class="text-sm text-slate-600">Краткое описание книги</label>
            <textarea x-model="shortDescription" required rows="4" minlength="10"
                      placeholder="Например: Космический детектив про киборга-одиночку на заброшенной станции, который расследует исчезновение экипажа"
                      class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="text-sm text-slate-600">Жанр (опционально)</label>
                <input type="text" x-model="genre" placeholder="Фантастика"
                       class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>
            <div>
                <label class="text-sm text-slate-600">Количество глав</label>
                <input type="number" x-model.number="chaptersCount" min="1" max="40"
                       class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>
        </div>

        <label class="flex items-center gap-2 text-sm text-slate-600">
            <input type="checkbox" x-model="useWebEnrichment">
            Обогащать сюжет реальными фактами из интернета (для историч./научпоп. тематики)
        </label>

        <button type="submit" :disabled="loading"
                class="w-full py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 transition disabled:opacity-50">
            <span x-text="loading ? 'Запускаем генерацию...' : 'Создать и сгенерировать'"></span>
        </button>
        <p class="text-xs text-slate-400">
            Генерация идёт в фоне и может занять несколько минут (особенно на бесплатном тире ИИ) — можно закрыть страницу, книга появится в каталоге по готовности.
        </p>
    </form>
</div>

<script>
function createBookForm() {
    return {
        shortDescription: '',
        genre: '',
        chaptersCount: 10,
        useWebEnrichment: false,
        loading: false,
        error: null,
        success: false,
        createdBookId: null,

        init() {
            requireAuthOrRedirect();
        },

        async submit() {
            this.loading = true;
            this.error = null;
            this.success = false;
            try {
                const res = await authFetch('/api/books', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        shortDescription: this.shortDescription,
                        genre: this.genre || undefined,
                        chaptersCount: this.chaptersCount,
                        useWebEnrichment: this.useWebEnrichment,
                    }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Не удалось создать книгу');

                this.createdBookId = data.book.id;
                this.success = true;
                this.shortDescription = '';
            } catch (e) {
                this.error = e.message;
            } finally {
                this.loading = false;
            }
        },
    };
}
</script>

</body>
</html>
