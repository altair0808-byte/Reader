<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Книга — AI Книги</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/auth-client.js"></script>
</head>
<body class="bg-slate-50 min-h-screen" x-data="bookPage()" x-init="init()">

<div class="max-w-3xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-6 text-sm">
        <a href="/" class="text-slate-500 hover:underline">← Все книги</a>
    </div>

    <div x-show="loading" class="text-slate-400">Загрузка...</div>

    <template x-if="!loading && book">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 mb-2" x-text="book.title"></h1>
            <div class="flex items-center gap-2 mb-4 text-sm text-slate-500">
                <span x-text="book.genre"></span>
                <span>·</span>
                <span x-text="{completed: 'Готова', generating: 'Генерируется', failed: 'Ошибка генерации', draft: 'Черновик'}[book.status]"></span>
            </div>

            <p class="text-slate-600 leading-relaxed mb-8" x-text="book.description || book.short_description"></p>

            <div x-show="book.status === 'failed'" class="mb-6 p-3 bg-red-100 text-red-700 rounded-lg text-sm">
                Генерация не удалась<span x-show="book.generation_error">: <span x-text="book.generation_error"></span></span>
            </div>

            <div x-show="book.status === 'generating'" class="mb-6 p-3 bg-amber-100 text-amber-700 rounded-lg text-sm">
                Книга ещё генерируется — главы будут появляться в списке по мере готовности. Обнови страницу через минуту.
            </div>

            <h2 class="text-lg font-semibold text-slate-800 mb-3">Оглавление</h2>

            <div x-show="chapters.length === 0" class="text-slate-400 text-sm">Глав пока нет.</div>

            <ol class="space-y-2">
                <template x-for="ch in chapters" :key="ch.id">
                    <li>
                        <a :href="`/reader.html?book_id=${book.id}&chapter=${ch.chapter_number}`"
                           class="flex items-center justify-between px-4 py-3 bg-white rounded-lg border border-slate-200 hover:shadow-sm transition"
                           :class="ch.status !== 'completed' ? 'opacity-60 pointer-events-none' : ''">
                            <span>
                                <span class="text-slate-400 mr-2" x-text="ch.chapter_number + '.'"></span>
                                <span class="text-slate-800" x-text="ch.title"></span>
                            </span>
                            <span class="text-xs px-2 py-0.5 rounded-full"
                                  :class="{
                                      'bg-green-100 text-green-700': ch.status === 'completed',
                                      'bg-amber-100 text-amber-700': ch.status === 'generating' || ch.status === 'pending'
                                  }"
                                  x-text="ch.status === 'completed' ? 'Готова' : 'Ожидание'"
                            ></span>
                        </a>
                    </li>
                </template>
            </ol>
        </div>
    </template>
</div>

<script>
function bookPage() {
    return {
        bookId: new URLSearchParams(location.search).get('book_id'),
        book: null,
        chapters: [],
        loading: true,

        async init() {
            if (!requireAuthOrRedirect()) return;
            if (!this.bookId) { this.loading = false; return; }

            const [bookRes, chaptersRes] = await Promise.all([
                authFetch(`/api/books/${this.bookId}`),
                authFetch(`/api/books/${this.bookId}/chapters`),
            ]);

            if (bookRes.ok) this.book = (await bookRes.json()).book;
            if (chaptersRes.ok) this.chapters = (await chaptersRes.json()).chapters;

            this.loading = false;
        },
    };
}
</script>

</body>
</html>
